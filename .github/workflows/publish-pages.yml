name: Publish hosted remote

on:
  push:
    branches:
      - main
      - master
      - work
    paths:
      - 'repo/**'
      - 'scripts/generate-flatpakrepo.sh'
      - '.github/workflows/publish-pages.yml'
      - 'README.md'
      - 'site/index.html'
  workflow_dispatch:

env:
  FLATPAK_REMOTE_BASE_URL: https://mgl-xyz.github.io/flathub
  FLATPAK_REMOTE_NAME: flathub
  FLATPAK_REMOTE_TITLE: mgl-xyz Flathub Remote

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Pages payload
        env:
          FLATPAK_REMOTE_GPG_KEY_FILE: /tmp/remote-public.asc
          FLATPAK_REMOTE_PUBLIC_KEY_ASC: ${{ secrets.FLATPAK_REMOTE_PUBLIC_KEY_ASC }}
          FLATPAK_SIGN_PRIVATE_KEY_ASC: ${{ secrets.FLATPAK_SIGN_PRIVATE_KEY_ASC }}
        run: |
          if [[ -n "${FLATPAK_SIGN_PRIVATE_KEY_ASC}" ]]; then
            export GNUPGHOME="$(mktemp -d)"
            chmod 700 "${GNUPGHOME}"
            printf '%s' "${FLATPAK_SIGN_PRIVATE_KEY_ASC}" | gpg --batch --import
            gpg --batch --armor --export > /tmp/remote-public.asc
            rm -rf "${GNUPGHOME}"
          else
            printf '%s' "${FLATPAK_REMOTE_PUBLIC_KEY_ASC}" > /tmp/remote-public.asc
          fi
          rm -rf public
          mkdir -p public
          cp -R repo public/repo
          cp site/index.html public/index.html
          ./scripts/generate-flatpakrepo.sh

      - name: Sign hosted repo summary
        env:
          FLATPAK_SIGN_PRIVATE_KEY_ASC: ${{ secrets.FLATPAK_SIGN_PRIVATE_KEY_ASC }}
          FLATPAK_SIGN_PW: ${{ secrets.FLATPAK_SIGN_PW }}
        run: |
          if [[ -z "${FLATPAK_SIGN_PRIVATE_KEY_ASC}" || -z "${FLATPAK_SIGN_PW}" ]]; then
            echo "Skipping summary signing because one or more signing secrets are missing."
            exit 0
          fi

          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "${GNUPGHOME}"
          printf '%s\n' 'pinentry-mode loopback' >> "${GNUPGHOME}/gpg.conf"
          printf '%s\n' 'allow-loopback-pinentry' >> "${GNUPGHOME}/gpg-agent.conf"

          printf '%s' "${FLATPAK_SIGN_PRIVATE_KEY_ASC}" | gpg --batch --import

          signing_fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr" {print $10; exit}')"
          if [[ -z "${signing_fpr}" ]]; then
            echo "No secret key fingerprint found after importing FLATPAK_SIGN_PRIVATE_KEY_ASC." >&2
            exit 1
          fi

          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "${FLATPAK_SIGN_PW}" \
            --local-user "${signing_fpr}" \
            --output public/repo/summary.sig \
            --detach-sign public/repo/summary

          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "${FLATPAK_SIGN_PW}" \
            --local-user "${signing_fpr}" \
            --output public/repo/summary.idx.sig \
            --detach-sign public/repo/summary.idx

          rm -rf "${GNUPGHOME}"

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
